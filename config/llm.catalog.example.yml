# 模型可同时配置 chat / embedding / image / transcription 多种用途；未提供的能力表示未知。
dashscope:
  type: dashscope
  apiKey: replace-me
  proxy: false
  models:
    main:
      upstreamModel: qwen3.5-plus
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
          supportsSearch: true
        defaults:
          temperature: 0.7
          top_p: 0.9
        searchEnabled: true
    fast:
      upstreamModel: qwen3.5-flash
      chat:
        capabilities:
          supportsThinking: true
          supportsTools: true
    vision:
      upstreamModel: qwen3.5-35b-a3b
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
    transcription:
      upstreamModel: qwen3-asr-flash
      transcription:
        capabilities:
          supportsAudioInput: true
          supportsTools: false
    embedding:
      upstreamModel: text-embedding-v4
      embedding: {}
deepseek:
  type: deepseek
  baseUrl: https://api.deepseek.com/anthropic
  apiKey: replace-me
  proxy: false
  search:
    maxUses: 3
  models:
    main:
      upstreamModel: deepseek-flash
      chat:
        capabilities:
          supportsThinking: true
          supportsTools: true
          supportsSearch: true
        preserveThinking: true
        searchEnabled: true
anthropic:
  type: anthropic
  baseUrl: https://api.anthropic.com
  apiKey: replace-me
  proxy: false
  models:
    main:
      upstreamModel: claude-sonnet-4-5-20250929
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
        defaults:
          maxOutputTokens: 4096
        preserveThinking: true
openai_responses:
  type: openai_responses
  baseUrl: https://api.openai.com/v1
  apiKey: replace-me
  proxy: true
  models:
    main:
      upstreamModel: gpt-5.6
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
        defaults:
          maxOutputTokens: 4096
          extra:
            reasoning:
              effort: medium
              summary: auto
        preserveThinking: true
lmstudio_local:
  type: lmstudio
  models:
    main:
      upstreamModel: qwen3.6-35b-a3b
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
        preserveThinking: true
vertex:
  type: vertex
  projectId: your-google-cloud-project
  location: global
  apiKey: replace-with-access-token
  models:
    main:
      upstreamModel: gemini-2.5-flash
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsSearch: true
        defaults:
          maxOutputTokens: 4096
        searchEnabled: true
openai_images:
  type: openai
  baseUrl: https://api.openai.com/v1
  apiKey: replace-me
  models:
    image:
      upstreamModel: gpt-image-1
      image:
        defaults:
          size: 1024x1024
          quality: low
openrouter:
  type: openrouter
  apiKey: replace-me
  models:
    embedding:
      upstreamModel: qwen/qwen3-embedding-8b
      embedding:
        inputMode: qwen3
        queryInstruction: 根据查询检索相关的资料和记忆。
