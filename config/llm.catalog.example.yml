# 模型可同时配置 chat / embedding / image / transcription 多种用途；OpenAI 官方另支持 speech / decision。
# 未声明的用途不可路由；未提供的能力标记表示未知。
# 自动发现优先使用原生清单，再以 models.dev 补缺；自定义网关可在 provider 层填写 modelsDevProvider: openai。
# modelsDevProvider 仅指定元信息来源，不改变请求协议、接口地址或可用模型清单。
dashscope:
  type: dashscope
  apiKey: replace-me
  proxy: false
  models:
    main:
      upstreamModel: qwen3.5-plus
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsVideoInput: true
          supportsTools: true
          supportsSearch: true
        defaults:
          temperature: 0.7
          top_p: 0.9
        searchEnabled: true
    fast:
      upstreamModel: qwen3.5-flash
      chat:
        capabilities:
          supportsThinking: true
          supportsTools: true
    vision:
      upstreamModel: qwen3.5-35b-a3b
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
    transcription:
      upstreamModel: qwen3-asr-flash
      transcription:
        capabilities:
          supportsAudioInput: true
          supportsTools: false
    embedding:
      upstreamModel: text-embedding-v4
      embedding: {}
deepseek:
  type: deepseek
  baseUrl: https://api.deepseek.com/anthropic
  apiKey: replace-me
  proxy: false
  search:
    maxUses: 3
  models:
    main:
      upstreamModel: deepseek-flash
      chat:
        capabilities:
          supportsThinking: true
          supportsTools: true
          supportsSearch: true
        preserveThinking: true
        searchEnabled: true
anthropic:
  type: anthropic
  baseUrl: https://api.anthropic.com
  apiKey: replace-me
  proxy: false
  models:
    main:
      upstreamModel: claude-sonnet-4-5-20250929
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
        defaults:
          maxOutputTokens: 4096
        preserveThinking: true
openai_official:
  type: openai
  apiKey: replace-with-openai-api-key
  proxy: true
  models:
    main:
      upstreamModel: gpt-6-sol
      chat:
        capabilities:
          supportsStructuredOutput: true
          supportsThinking: true
          thinkingControllable: false
          supportsVision: true
          supportsTools: true
          supportsSearch: true
        defaults:
          maxOutputTokens: 4096
          reasoningEffort: medium
          verbosity: medium
        preserveThinking: true
        searchEnabled: false
    embedding:
      upstreamModel: text-embedding-3-small
      embedding: {}
    transcription:
      upstreamModel: gpt-transcribe
      transcription:
        language: zh
    speech:
      upstreamModel: gpt-4o-mini-tts
      speech:
        voice: coral
        format: mp3
        speed: 1
    image:
      upstreamModel: gpt-image-2.6-sunburst
      image:
        capabilities:
          referenceImages: true
        defaults:
          size: 1024x1024
          output_format: png
          # 生成 GIF 时改为 gif；也可由 generate_image 按次指定格式、帧数和时长。
          # frame_count: 9
          # frame_duration_ms: 200
    decision:
      upstreamModel: gpt-6-luna
      decision: {}
responses_gateway:
  type: openai_responses_compatible
  baseUrl: https://your-responses-gateway.example/v1
  apiKey: replace-me
  models: {}
lmstudio_local:
  type: lmstudio
  models:
    main:
      upstreamModel: qwen3.6-35b-a3b
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsTools: true
        preserveThinking: true
vertex:
  type: vertex
  projectId: your-google-cloud-project
  location: global
  apiKey: replace-with-access-token
  models:
    main:
      upstreamModel: gemini-2.5-flash
      chat:
        capabilities:
          supportsThinking: true
          supportsVision: true
          supportsVideoInput: true
          supportsSearch: true
        defaults:
          maxOutputTokens: 4096
        searchEnabled: true
openrouter:
  type: openrouter
  apiKey: replace-me
  models:
    # 可选轻量文本模型；不会自动替换任何路由角色。
    # 固定实际供应商，避免把聚合最低价误认为 DeepInfra 价格。
    ling_flash_deepinfra:
      upstreamModel: inclusionai/ling-3.0-flash
      chat:
        capabilities:
          supportsThinking: true
          thinkingControllable: true
          supportsVision: false
          supportsTools: true
        defaults:
          extra:
            provider:
              only: [deepinfra/bf16]
              allow_fallbacks: false
              require_parameters: true
        preserveThinking: false
    embedding:
      upstreamModel: qwen/qwen3-embedding-8b
      embedding:
        inputMode: qwen3
        queryInstruction: 根据查询检索相关的资料和记忆。

google:
  type: google
  apiKey: replace-with-google-api-key
  proxy: true
  models:
    flash:
      upstreamModel: gemini-2.5-flash
      chat:
        capabilities:
          supportsThinking: true
          thinkingControllable: true
          supportsVision: true
          supportsVideoInput: true
          supportsTools: true
          supportsStructuredOutput: true
          supportsSearch: true
        googleThinking:
          mode: budget
          budget: 2048
        defaults:
          maxOutputTokens: 8192

    embedding:
      upstreamModel: gemini-embedding-2
      embedding:
        limits: { maxInputTokens: 8192 }
        dimensions: 768
        inputMode: task_prefix
        queryPrefix: "task: search result | query: "
        documentPrefix: "title: none | text: "
    image:
      upstreamModel: gemini-nano-banana-2.1
      image:
        capabilities: { referenceImages: true }
        constraints:
          aspectRatios: ["1:1", "16:9", "9:16"]
          resolutions: ["1K", "2K", "4K"]
          maxReferenceImages: 14
        defaults: { aspect_ratio: "1:1", resolution: "1K" }
