default:
  historyWindow:
    maxRecentMessages: 80
    maxImageReferences: 5
  tokenLimits:
    triggerTokens: 150000
    retainTokens: 7000

balanced:
  mainSmall:
    - provider: dashscope
      model: fast
  mainLarge:
    - provider: dashscope
      model: main
    - provider: deepseek
      model: main
    - provider: anthropic
      model: main
  summarizer:
    - provider: dashscope
      model: fast
  textInspector:
    - provider: dashscope
      model: fast
  sessionCaptioner:
    - provider: dashscope
      model: fast
  imageCaptioner:
    - provider: dashscope
      model: vision
  imageInspector:
    - provider: dashscope
      model: vision
  audioTranscription:
    - provider: dashscope
      model: transcription
  turnPlanner:
    - provider: dashscope
      model: fast
  embedding:
    - provider: dashscope
      model: embedding
