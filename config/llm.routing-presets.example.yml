default:
  historyWindow:
    maxRecentMessages: 80
    maxImageReferences: 5
  tokenLimits:
    contextTokens: 150000
    retainTokens: 7000
balanced:
  mainSmall:
    - provider: dashscope
      model: fast
  mainLarge:
    - provider: dashscope
      model: main
    - provider: deepseek
      model: main
    - provider: anthropic
      model: main
  summarizer:
    - provider: dashscope
      model: fast
  textInspector:
    - provider: dashscope
      model: fast
  sessionCaptioner:
    - provider: dashscope
      model: fast
  imageGenerator:
    - provider: openai_official
      model: image
  imageCaptioner:
    - provider: dashscope
      model: vision
  imageInspector:
    - provider: dashscope
      model: vision
  audioTranscription:
    - provider: dashscope
      model: transcription
  turnPlanner:
    - provider: dashscope
      model: fast
# 可选官方能力预设；不自动切换当前 routingPreset。
openai_native:
  mainSmall: { provider: openai_official, model: main }
  mainLarge: { provider: openai_official, model: main }
  summarizer: { provider: openai_official, model: main }
  textInspector: { provider: openai_official, model: main }
  sessionCaptioner: { provider: openai_official, model: main }
  imageCaptioner: { provider: openai_official, model: main }
  imageInspector: { provider: openai_official, model: main }
  turnPlanner: { provider: openai_official, model: main }
  imageGenerator: { provider: openai_official, model: image }
  audioTranscription: { provider: openai_official, model: transcription }
  speechGenerator: { provider: openai_official, model: speech }
  decision: { provider: openai_official, model: decision } # 内部规划优先使用；留空列表则仅用 turnPlanner 聊天路由。
